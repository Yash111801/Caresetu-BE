services:
  mysql:
    image: mysql:8.4
    container_name: caresetu-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: caresetu
      MYSQL_USER: caresetu
      MYSQL_PASSWORD: caresetu
      MYSQL_ROOT_PASSWORD: rootcaresetu
    ports:
      - "3307:3306"
    volumes:
      - caresetu_mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootcaresetu"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caresetu_mysql_data:
